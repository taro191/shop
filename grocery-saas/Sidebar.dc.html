<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; }
    a { color: #b45309; text-decoration: none; }
    a:hover { color: #92400e; }
    .nav-row { transition: background-color .12s ease, color .12s ease; }
    .nav-row:hover { background: rgba(255,255,255,0.06); }
    .nav-row.active:hover { background: inherit; }
    .logout-row:hover { background: rgba(255,255,255,0.08); }
  </style>
</helmet>
<div style="width:240px; height:960px; background:oklch(0.26 0.045 155); display:flex; flex-direction:column; color:oklch(0.9 0.02 150); font-family:'Noto Sans Thai',sans-serif; flex-shrink:0;">

  <!-- Logo / brand -->
  <div style="display:flex; align-items:center; gap:10px; padding:22px 20px 18px 20px;">
    <div style="width:36px; height:36px; border-radius:10px; background:oklch(0.72 0.15 55); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.22 0.05 155)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1.6-5.2A2 2 0 0 1 6.5 2.5h11a2 2 0 0 1 1.9 1.3L21 9"></path>
        <path d="M3 9h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"></path>
        <path d="M9 13a3 3 0 0 0 6 0"></path>
      </svg>
    </div>
    <div style="display:flex; flex-direction:column; line-height:1.25;">
      <div style="font-family:'Kanit',sans-serif; font-weight:600; font-size:16px; color:#ffffff;">ร้านชำ<span style="color:oklch(0.72 0.15 55);">ครบวงจร</span></div>
      <div style="font-size:11px; color:oklch(0.75 0.02 150);">ระบบจัดการร้านค้า</div>
    </div>
  </div>

  <!-- Store card -->
  <div style="margin:4px 16px 18px 16px; padding:12px 14px; border-radius:12px; background:rgba(255,255,255,0.06); display:flex; flex-direction:column; gap:4px;">
    <div style="font-size:13px; font-weight:600; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{storeName}}</div>
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="width:6px; height:6px; border-radius:50%; background:oklch(0.72 0.15 55); display:inline-block;"></span>
      <span style="font-size:11px; color:oklch(0.78 0.03 150);">{{plan}}</span>
    </div>
  </div>

  <!-- Nav -->
  <div style="display:flex; flex-direction:column; gap:2px; padding:0 12px; flex-grow:1;">

    <div class="nav-row" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:{{navDashboardBg}}; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{navDashboardColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      <span style="font-size:14px; font-weight:{{navDashboardWeight}}; color:{{navDashboardColor}};">แดชบอร์ด</span>
    </div>

    <div class="nav-row" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:{{navInventoryBg}}; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{navInventoryColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>
      <span style="font-size:14px; font-weight:{{navInventoryWeight}}; color:{{navInventoryColor}};">คลังสินค้า</span>
    </div>

    <div class="nav-row" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:{{navCompareBg}}; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{navCompareColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v11a2 2 0 0 0 2 2h11"></path><path d="M7 8l-4 4 4 4"></path><path d="M17 21V10a2 2 0 0 0-2-2H4"></path><path d="M17 16l4-4-4-4"></path></svg>
      <span style="font-size:14px; font-weight:{{navCompareWeight}}; color:{{navCompareColor}};">เทียบราคาซัพพลายเออร์</span>
    </div>

    <div class="nav-row" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:{{navIncomeBg}}; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{navIncomeColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2"></rect><path d="M2.5 10h19"></path><circle cx="16.5" cy="14.5" r="1.5"></circle></svg>
      <span style="font-size:14px; font-weight:{{navIncomeWeight}}; color:{{navIncomeColor}};">รายรับรายวัน</span>
    </div>

    <div class="nav-row" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:{{navBillsBg}}; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{navBillsColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v18l-3-2-3 2-3-2-3 2V2z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path></svg>
      <span style="font-size:14px; font-weight:{{navBillsWeight}}; color:{{navBillsColor}};">บิลซื้อสินค้า</span>
    </div>

    <div class="nav-row" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:{{navReportsBg}}; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{navReportsColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9"></path><path d="M10 21V3"></path><path d="M17 21v-7"></path><path d="M3 21h18"></path></svg>
      <span style="font-size:14px; font-weight:{{navReportsWeight}}; color:{{navReportsColor}};">รายงานสรุป</span>
    </div>

  </div>

  <!-- User / logout -->
  <div style="padding:14px 16px 20px 16px; border-top:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:10px; margin-top:8px;">
    <div style="width:34px; height:34px; border-radius:50%; background:oklch(0.5 0.06 152); display:flex; align-items:center; justify-content:center; font-family:'Kanit',sans-serif; font-weight:600; color:#fff; font-size:13px; flex-shrink:0;">สม</div>
    <div style="display:flex; flex-direction:column; flex-grow:1; min-width:0;">
      <div style="font-size:12.5px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">คุณสมชาย ใจดี</div>
      <div style="font-size:11px; color:oklch(0.7 0.02 150);">เจ้าของร้าน</div>
    </div>
    <div class="logout-row" style="width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.75 0.02 150)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{
  "active": {"editor": "enum", "default": "dashboard", "options": ["dashboard","inventory","compare","income","bills","reports"]},
  "storeName": {"editor": "text", "default": "ร้านสมชายพาณิชย์"},
  "plan": {"editor": "text", "default": "แผน Standard · ใช้งานอยู่"}
}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const ACTIVE_BG = 'oklch(0.72 0.15 55)';
    const ACTIVE_COLOR = 'oklch(0.2 0.05 155)';
    const IDLE_COLOR = 'oklch(0.82 0.02 150)';
    const item = (key) => ({
      bg: active === key ? ACTIVE_BG : 'transparent',
      color: active === key ? ACTIVE_COLOR : IDLE_COLOR,
      weight: active === key ? '600' : '400'
    });
    const d = item('dashboard'), inv = item('inventory'), cmp = item('compare'),
          inc = item('income'), bil = item('bills'), rep = item('reports');
    return {
      storeName: this.props.storeName ?? 'ร้านสมชายพาณิชย์',
      plan: this.props.plan ?? 'แผน Standard · ใช้งานอยู่',
      navDashboardBg: d.bg, navDashboardColor: d.color, navDashboardWeight: d.weight,
      navInventoryBg: inv.bg, navInventoryColor: inv.color, navInventoryWeight: inv.weight,
      navCompareBg: cmp.bg, navCompareColor: cmp.color, navCompareWeight: cmp.weight,
      navIncomeBg: inc.bg, navIncomeColor: inc.color, navIncomeWeight: inc.weight,
      navBillsBg: bil.bg, navBillsColor: bil.color, navBillsWeight: bil.weight,
      navReportsBg: rep.bg, navReportsColor: rep.color, navReportsWeight: rep.weight
    };
  }
}
</script>
</body>
</html>
