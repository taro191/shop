<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif; }
    a { color: #b45309; } a:hover { color: #92400e; }
    .chip, .fab, .bill-card { cursor: pointer; }
    .fab:active { transform: scale(0.96); }
    .field input, .field select { width: 100%; font-family: 'Noto Sans Thai', sans-serif; font-size: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid oklch(0.87 0.005 90); outline: none; box-sizing: border-box; }
    .field input:focus, .field select:focus { border-color: oklch(0.6 0.1 152); }
    .field label { font-size: 12.5px; font-weight: 600; color: oklch(0.4 0.01 90); margin-bottom: 6px; display: block; }
  </style>
</helmet>

<div style="width:390px; height:844px; display:flex; flex-direction:column; background:oklch(0.985 0.004 90); overflow:hidden; position:relative;">

  <!-- App bar -->
  <div style="padding:20px 20px 4px 20px; flex-shrink:0;">
    <div style="font-family:'Kanit',sans-serif; font-weight:600; font-size:21px; color:oklch(0.24 0.01 90);">บิลซื้อสินค้า</div>
    <div style="font-size:12.5px; color:oklch(0.5 0.01 90); margin-top:2px;">ค้างชำระ ฿{{pendingTotal}} จาก {{pendingCount}} บิล</div>
  </div>

  <!-- Status chips -->
  <div style="display:flex; gap:8px; padding:14px 20px 0 20px; flex-shrink:0; overflow-x:auto;">
    <sc-for list="{{statusChips}}" as="chip" hint-placeholder-count="4">
      <div class="chip" onClick="{{chip.pick}}" style="flex-shrink:0; padding:8px 15px; border-radius:9px; font-size:12.5px; font-weight:500; background:{{chip.bg}}; color:{{chip.color}}; border:1px solid {{chip.border}};">{{chip.label}}</div>
    </sc-for>
  </div>

  <!-- Content -->
  <div style="flex-grow:1; overflow-y:auto; padding:14px 20px 96px 20px;">

    <div style="display:flex; align-items:center; gap:8px; background:#fff; border:1px solid oklch(0.9 0.005 90); border-radius:12px; padding:11px 14px; margin-bottom:14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.01 90)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input type="text" placeholder="ค้นหาเลขที่บิล, ซัพพลายเออร์..." value="{{search}}" onChange="{{onSearch}}" style="border:none; outline:none; font-size:13.5px; font-family:'Noto Sans Thai',sans-serif; flex-grow:1; background:transparent;" />
    </div>

    <div style="display:flex; flex-direction:column; gap:10px;">
      <sc-for list="{{rows}}" as="b" hint-placeholder-count="6">
        <div class="bill-card" onClick="{{b.toggle}}" style="background:#fff; border:1px solid oklch(0.92 0.005 90); border-radius:14px; padding:14px 16px;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
            <div style="min-width:0;">
              <div style="font-size:13.5px; font-weight:600; color:oklch(0.24 0.01 90);">{{b.billNo}}</div>
              <div style="font-size:12px; color:oklch(0.5 0.01 90); margin-top:2px;">{{b.supplier}}</div>
              <div style="font-size:11px; color:oklch(0.6 0.01 90); margin-top:2px;">{{b.date}}</div>
            </div>
            <div style="text-align:right; flex-shrink:0;">
              <div style="font-family:'Kanit',sans-serif; font-size:16px; font-weight:700; color:oklch(0.24 0.01 90);">฿{{b.amount}}</div>
              <div style="font-size:10.5px; font-weight:600; margin-top:4px; padding:3px 9px; border-radius:6px; background:{{b.statusBg}}; color:{{b.statusColor}};">{{b.statusText}}</div>
            </div>
          </div>

          <sc-if value="{{b.expanded}}" hint-placeholder-val="{{false}}">
            <div style="margin-top:12px; padding-top:12px; border-top:1px solid oklch(0.94 0.004 90);">
              <sc-for list="{{b.lineItems}}" as="li" hint-placeholder-count="3">
                <div style="display:flex; justify-content:space-between; padding:5px 0; font-size:12px;">
                  <span style="color:oklch(0.35 0.01 90);">{{li.name}} × {{li.qty}}</span>
                  <span style="font-weight:600; color:oklch(0.24 0.01 90);">฿{{li.subtotal}}</span>
                </div>
              </sc-for>
              <sc-if value="{{b.noItems}}" hint-placeholder-val="{{false}}">
                <div style="font-size:12px; color:oklch(0.55 0.01 90); text-align:center; padding:6px 0;">ไม่มีรายการสินค้าแนบในบิลนี้</div>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div style="text-align:center; padding:40px 20px; font-size:13px; color:oklch(0.55 0.01 90);">ไม่พบบิลที่ค้นหา</div>
    </sc-if>

  </div>

  <!-- FAB -->
  <div class="fab" onClick="{{openSheet}}" style="position:absolute; right:20px; bottom:96px; width:54px; height:54px; border-radius:16px; background:oklch(0.72 0.15 55); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px oklch(0.6 0.15 50 / 0.35);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.2 0.05 155)" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:0;">
    <dc-import name="BottomNav" active="bills" hint-size="390px,76px"></dc-import>
  </div>

  <!-- Bottom sheet -->
  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <div onClick="{{closeSheet}}" style="position:absolute; inset:0; background:rgba(20,25,20,0.4); z-index:5;"></div>
    <div style="position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:22px 22px 0 0; padding:12px 20px 28px 20px; z-index:6; box-shadow:0 -10px 30px rgba(0,0,0,0.12); max-height:80%; overflow-y:auto;">
      <div style="width:36px; height:4px; border-radius:3px; background:oklch(0.88 0.005 90); margin:0 auto 18px auto;"></div>
      <div style="font-family:'Kanit',sans-serif; font-weight:600; font-size:16px; color:oklch(0.24 0.01 90); margin-bottom:16px; text-align:center;">เพิ่มบิลซื้อสินค้า</div>
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="field">
          <label>เลขที่บิล</label>
          <input type="text" placeholder="เช่น INV-1042" value="{{form.billNo}}" onChange="{{setBillNo}}" />
        </div>
        <div class="field">
          <label>ซัพพลายเออร์</label>
          <select value="{{form.supplier}}" onChange="{{setSupplier}}">
            <option value="สมบูรณ์การค้า">สมบูรณ์การค้า</option>
            <option value="ทองดีพาณิชย์">ทองดีพาณิชย์</option>
            <option value="แม่ประนอมโฮลเซล">แม่ประนอมโฮลเซล</option>
          </select>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="field">
            <label>ยอดเงิน (บาท)</label>
            <input type="text" placeholder="0" value="{{form.amount}}" onChange="{{setAmount}}" />
          </div>
          <div class="field">
            <label>สถานะ</label>
            <select value="{{form.status}}" onChange="{{setStatus}}">
              <option value="pending">รอชำระ</option>
              <option value="paid">ชำระแล้ว</option>
            </select>
          </div>
        </div>
        <div class="fab" onClick="{{saveBill}}" style="text-align:center; background:oklch(0.72 0.15 55); border-radius:12px; padding:14px; font-size:14px; font-weight:700; color:oklch(0.2 0.05 155); margin-top:4px;">บันทึกบิล</div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      search: '',
      status: 'all',
      sheetOpen: false,
      expandedId: null,
      form: { billNo: '', supplier: 'สมบูรณ์การค้า', amount: '', status: 'pending' },
      bills: [
        { id: 1, billNo: 'INV-1038', supplier: 'สมบูรณ์การค้า', date: '18 ส.ค. 2569', amount: 4820, status: 'paid',
          lineItems: [
            { name: 'ข้าวสารหอมมะลิ 5kg', qty: '10 ถุง', subtotal: 1750 },
            { name: 'น้ำมันพืชตราองุ่น 1L', qty: '20 ขวด', subtotal: 940 },
            { name: 'น้ำปลาตราปลาหมึก 700ml', qty: '30 ขวด', subtotal: 960 }
          ] },
        { id: 2, billNo: 'INV-1041', supplier: 'ทองดีพาณิชย์', date: '17 ส.ค. 2569', amount: 3150, status: 'pending',
          lineItems: [
            { name: 'มาม่าต้มยำกุ้ง (ลัง)', qty: '5 ลัง', subtotal: 750 },
            { name: 'ผงซักฟอกไบรท์ 1kg', qty: '30 ถุง', subtotal: 1185 }
          ] },
        { id: 3, billNo: 'INV-1044', supplier: 'แม่ประนอมโฮลเซล', date: '15 ส.ค. 2569', amount: 2680, status: 'overdue', lineItems: [] },
        { id: 4, billNo: 'INV-1046', supplier: 'สมบูรณ์การค้า', date: '14 ส.ค. 2569', amount: 5920, status: 'paid', lineItems: [] },
        { id: 5, billNo: 'INV-1049', supplier: 'ทองดีพาณิชย์', date: '12 ส.ค. 2569', amount: 1980, status: 'pending', lineItems: [] },
        { id: 6, billNo: 'INV-1051', supplier: 'แม่ประนอมโฮลเซล', date: '10 ส.ค. 2569', amount: 3420, status: 'paid', lineItems: [] }
      ]
    };
  }
  renderVals() {
    const st = this.state;
    const STATUS_META = {
      pending: { text: 'รอชำระ', bg: 'oklch(0.95 0.04 55)', color: 'oklch(0.55 0.16 50)' },
      paid: { text: 'ชำระแล้ว', bg: 'oklch(0.94 0.03 152)', color: 'oklch(0.42 0.09 152)' },
      overdue: { text: 'เกินกำหนด', bg: 'oklch(0.94 0.03 20)', color: 'oklch(0.58 0.19 25)' }
    };

    const statusChips = [
      { key: 'all', label: 'ทั้งหมด' },
      { key: 'pending', label: 'รอชำระ' },
      { key: 'paid', label: 'ชำระแล้ว' },
      { key: 'overdue', label: 'เกินกำหนด' }
    ].map((s) => {
      const active = st.status === s.key;
      return {
        label: s.label,
        bg: active ? 'oklch(0.42 0.09 152)' : '#ffffff',
        color: active ? '#ffffff' : 'oklch(0.4 0.01 90)',
        border: active ? 'oklch(0.42 0.09 152)' : 'oklch(0.88 0.005 90)',
        pick: () => this.setState({ status: s.key })
      };
    });

    const q = st.search.trim().toLowerCase();
    const filtered = st.bills.filter((b) =>
      (st.status === 'all' || b.status === st.status) &&
      (q === '' || b.billNo.toLowerCase().indexOf(q) !== -1 || b.supplier.toLowerCase().indexOf(q) !== -1)
    );

    const rows = filtered.map((b) => {
      const meta = STATUS_META[b.status];
      const expanded = st.expandedId === b.id;
      return {
        ...b,
        statusText: meta.text, statusBg: meta.bg, statusColor: meta.color,
        expanded,
        noItems: b.lineItems.length === 0,
        toggle: () => this.setState({ expandedId: expanded ? null : b.id })
      };
    });

    const pending = st.bills.filter((b) => b.status === 'pending' || b.status === 'overdue');
    const pendingTotal = pending.reduce((s, b) => s + b.amount, 0);

    const updateField = (field) => (e) => {
      this.setState({ form: { ...this.state.form, [field]: e.target.value } });
    };

    return {
      pendingTotal, pendingCount: pending.length,
      statusChips, rows,
      isEmpty: rows.length === 0,
      search: st.search,
      onSearch: (e) => this.setState({ search: e.target.value }),
      sheetOpen: st.sheetOpen,
      openSheet: () => this.setState({ sheetOpen: true }),
      closeSheet: () => this.setState({ sheetOpen: false }),
      form: st.form,
      setBillNo: updateField('billNo'),
      setSupplier: updateField('supplier'),
      setAmount: updateField('amount'),
      setStatus: updateField('status'),
      saveBill: () => {
        const f = this.state.form;
        if (!f.billNo.trim()) return;
        const newBill = {
          id: Date.now(),
          billNo: f.billNo.trim(),
          supplier: f.supplier,
          date: '19 ส.ค. 2569',
          amount: parseFloat(f.amount) || 0,
          status: f.status,
          lineItems: []
        };
        this.setState({
          bills: [newBill, ...this.state.bills],
          sheetOpen: false,
          form: { billNo: '', supplier: 'สมบูรณ์การค้า', amount: '', status: 'pending' }
        });
      }
    };
  }
}
</script>
</body>
</html>
