<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ออฟไลน์ — ร้านชำครบวงจร</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #FBFBF9; color: #24211D; font-family: -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
  .card { max-width: 360px; }
  .icon { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; background: #356B41;
    display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 700; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #6E6759; line-height: 1.6; margin: 0 0 20px; }
  button { border: none; background: #356B41; color: white; font-size: 14px; font-weight: 600;
    padding: 12px 20px; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">ร้าน</div>
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>หน้านี้ยังไม่เคยถูกโหลดไว้ล่วงหน้า จึงเปิดใช้งานแบบออฟไลน์ไม่ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่อีกครั้ง</p>
    <button onclick="location.reload()">ลองใหม่</button>
  </div>
</body>
</html>
